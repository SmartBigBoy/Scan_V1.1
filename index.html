<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>扫描文稿</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
</head>
<body>
    <!-- ==================== Scanner Screen ==================== -->
    <div id="screen-scanner" class="screen active">
        <div id="scanner-viewfinder">
            <video id="scanner-video" autoplay playsinline muted></video>
            <canvas id="scanner-overlay"></canvas>

            <!-- Animated scanning lines -->
            <div id="scan-lines"></div>

            <!-- Detection frame -->
            <div id="detection-frame">
                <div class="frame-corner tl"></div>
                <div class="frame-corner tr"></div>
                <div class="frame-corner bl"></div>
                <div class="frame-corner br"></div>
                <div class="frame-label">自动扫描中…</div>
            </div>

            <!-- Notch area -->
            <div id="scanner-notch">
                <button id="btn-close" class="nav-btn" aria-label="关闭">取消</button>
                <span id="scanner-title">扫描文稿</span>
                <button id="btn-flash" class="nav-btn" aria-label="闪光灯">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </button>
            </div>

            <!-- Authorization prompt -->
            <div id="camera-prompt">
                <div class="camera-prompt-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </div>
                <h2>使用相机扫描文稿</h2>
                <p>允许访问相机以开始扫描</p>
                <button id="btn-start-camera">允许访问相机</button>
            </div>
        </div>

        <!-- Bottom toolbar -->
        <div id="scanner-toolbar">
            <div class="toolbar-inner">
                <button id="btn-gallery" class="toolbar-btn" aria-label="相册">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </button>
                <button id="btn-shutter" class="shutter-btn" aria-label="拍摄">
                    <div class="shutter-outer">
                        <div class="shutter-inner"></div>
                    </div>
                </button>
                <button id="btn-auto" class="toolbar-btn active" aria-label="自动扫描">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== Adjust Screen ==================== -->
    <div id="screen-adjust" class="screen">
        <div id="adjust-header">
            <button id="btn-adjust-retake" class="nav-btn">重新扫描</button>
            <span id="adjust-title">调整扫描区域</span>
            <button id="btn-adjust-done" class="nav-btn done-btn">存储</button>
        </div>
        <div id="adjust-container">
            <div id="adjust-image-wrap">
                <img id="adjust-image" alt="扫描图像">
                <div id="adjust-overlay">
                    <svg id="adjust-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <polygon id="adjust-polygon" points="5,5 95,5 95,95 5,95" fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="1.5"/>
                    </svg>
                    <div id="corner-tl" class="corner-handle" data-index="0"></div>
                    <div id="corner-tr" class="corner-handle" data-index="1"></div>
                    <div id="corner-br" class="corner-handle" data-index="2"></div>
                    <div id="corner-bl" class="corner-handle" data-index="3"></div>
                </div>
            </div>
        </div>
        <div id="adjust-hint">拖拽四角以调整扫描区域</div>
    </div>

    <!-- ==================== Preview Screen ==================== -->
    <div id="screen-preview" class="screen">
        <div id="preview-header">
            <button id="btn-preview-back" class="nav-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span id="preview-title">扫描文稿</span>
            <button id="btn-preview-save" class="nav-btn done-btn">存储</button>
        </div>

        <div id="preview-pages">
            <div id="pages-scroll">
                <!-- Page thumbnails will be added here -->
            </div>
            <button id="btn-add-page" class="add-page-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>添加</span>
            </button>
        </div>

        <div id="preview-main">
            <img id="preview-image" alt="扫描预览">
        </div>

        <!-- Filter bottom sheet -->
        <div id="filter-sheet">
            <div id="filter-options">
                <button class="filter-option active" data-filter="original">
                    <div class="filter-preview" style="background: linear-gradient(135deg, #f5f5f5, #ddd);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </div>
                    <span>原稿</span>
                </button>
                <button class="filter-option" data-filter="gray">
                    <div class="filter-preview" style="background: linear-gradient(135deg, #aaa, #666);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </div>
                    <span>灰度</span>
                </button>
                <button class="filter-option" data-filter="bw">
                    <div class="filter-preview" style="background: linear-gradient(135deg, #fff, #000);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </div>
                    <span>黑白</span>
                </button>
                <button class="filter-option" data-filter="enhance">
                    <div class="filter-preview" style="background: linear-gradient(135deg, #e8f5e9, #81c784);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                    </div>
                    <span>自动</span>
                </button>
            </div>
        </div>

        <!-- Bottom actions -->
        <div id="preview-actions">
            <button id="btn-share" class="action-btn secondary-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                分享
            </button>
            <button id="btn-save-pdf" class="action-btn primary-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                存储为 PDF
            </button>
        </div>
    </div>

    <!-- Hidden file input for gallery -->
    <input type="file" id="file-input" accept="image/*" multiple>

    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
